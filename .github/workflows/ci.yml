name: CI & Security Quality Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Code Linting & Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linting Tools
        run: pip install ruff
      - name: Run Ruff Linter
        run: ruff check .

  type-check:
    name: Static Type Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install mypy
      - name: Run Mypy
        run: mypy core modules report venom.py

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Package & Test Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest respx pypdf
      - name: Run Pytest Suite
        run: pytest

  security-audit:
    name: DevSecOps Vulnerability & SAST Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Security Scanners
        run: pip install bandit pip-audit
      - name: Run Bandit SAST Scanner
        run: bandit -r core modules report venom.py -ll -ii
      - name: Run Pip-Audit Dependency Scanner
        run: pip-audit -r requirements.txt
