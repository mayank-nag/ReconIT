[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reconit"
version = "1.0.0"
description = "ReconIT (Venom) — Automated Low-Impact OSINT Reconnaissance Framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mayank Nag", email = "mayank@reconit.dev" }
]
keywords = ["osint", "recon", "python", "security-tools", "devsecops", "threat-intel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27.0,<1.0.0",
    "dnspython>=2.6.1,<3.0.0",
    "python-whois>=0.9.4,<1.0.0",
    "python-dateutil>=2.9.0,<3.0.0",
    "beautifulsoup4>=4.12.3,<5.0.0",
    "lxml>=5.2.1,<7.0.0",
    "cryptography>=42.0.5,<51.0.0",
    "networkx>=3.3,<4.0",
    "pyvis>=0.3.2,<1.0.0",
    "Jinja2>=3.1.4,<4.0.0",
    "MarkupSafe>=2.1.0,<4.0.0",
    "PyYAML>=6.0.1,<7.0.0",
    "exifread>=3.0.0,<4.0.0",
    "pypdf>=4.0.0,<7.0.0",
    "Pillow>=10.3.0,<13.0.0",
    "rich>=13.7.0,<16.0.0",
    "tqdm>=4.66.4,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "bandit>=1.7.8",
    "pip-audit>=2.7.0",
]

[project.scripts]
venom = "venom:main"
reconit = "venom:main"

[tool.setuptools]
py-modules = ["venom"]
packages = ["core", "modules", "report"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
